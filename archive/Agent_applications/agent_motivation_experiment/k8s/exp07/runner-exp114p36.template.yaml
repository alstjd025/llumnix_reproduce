---
# EXP-27: rate x mix sweep with the shortened swe workload.
# mixed_request_level_poisson delegates to the three request-level workloads;
# MIX_JSON sets the request-count ratio. 12 procs x 2048 threads (the SWE
# transcript subset is 170MB resident per process). Requires the no-timeout
# gateway (patch-gateway-timeout.sh) + 64Gi, admission off.
# Placeholders: __JOBNAME__ __SESSION__ __RATES__ __DURMIN__ __ARM__ __WCFG__
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOBNAME__
  namespace: llumnix
spec:
  backoffLimit: 0
  completions: 1
  template:
    metadata:
      labels:
        app: bench-runner-exp21
    spec:
      serviceAccountName: bench-runner
      restartPolicy: Never
      containers:
        - name: runner
          image: llumnix-registry.cn-beijing.cr.aliyuncs.com/llumnix/vllm:20260306-165123
          workingDir: /work
          env:
            - { name: NVIDIA_VISIBLE_DEVICES, value: "void" }
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef: { name: llumnix-model, key: MODEL_ID }
            # How many engine instances this fleet has. Everything that reads the
            # fleet used to carry its own copy of "8000,8001,8002,8003", so a
            # fleet of eight would have been scraped as four with nothing saying
            # so -- the performance numbers look normal and half the engine
            # series are simply absent. This key is required, not optional: a
            # ConfigMap without it stops the pod instead of quietly measuring a
            # fleet of a size nobody chose.
            - name: ENGINE_PORTS
              valueFrom:
                configMapKeyRef: { name: llumnix-model, key: ENGINE_PORTS }
            - { name: HF_HOME, value: /hf-cache }
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: HF_DATASETS_OFFLINE, value: "1" }
            - { name: RATE_LIST, value: "__RATES__" }
            - { name: DURATION_MIN, value: "__DURMIN__" }
            # EXP-114: thirty-six worker processes. Twenty-four delivered the nominal
            # rate in every STATIC condition, including four minutes at 279 req/s, but
            # not in the hour trace: nineteen of its sixty-one minutes came out under
            # 85% of schedule and the peak stretch (204-279 req/s scheduled) delivered
            # 50-68%. The difference is concurrency rather than rate -- a static
            # condition starts empty, while by minute fifty of the hour the fleet has
            # been above its knee for long stretches and each worker is holding far
            # more open streams, which is what saturates one CPython interpreter lock.
            - { name: LOAD_PROCS, value: "36" }
            - { name: ARM, value: "__ARM__" }
            - { name: TRANSCRIPT, value: "/work/workloads/codingagent_request_level_poisson/data/transcript_swe_short7k_mix1500.jsonl" }
            - { name: WCFG_PATH, value: "__WCFG__" }
            # Output-token cap. Unset, agent.py falls back to DEFAULT_MAX_TOKENS
            # = 2048, and the deep-research class was being cut there: with the
            # seven-section report structure the model reached section two and
            # stopped mid-word, so its length was set by the cap rather than by
            # the material. chat (p99 1,440) and the agent class (p99 859) end on
            # their own well below it and are unaffected by raising it.
            - { name: MAX_TOKENS, value: "4096" }
            - { name: RESULT_UID, value: "3092" }
            - { name: RESULT_GID, value: "1999" }
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -uo pipefail
              ln -sf /usr/local/bin/k3s /usr/local/bin/kubectl
              kubectl version --client >/dev/null 2>&1 && echo "[runner] kubectl ok"
              PYBIN=/work/.venv/bin/python
              "$PYBIN" -c "import langchain_openai, pandas, pyarrow, tiktoken" \
                && echo "[runner] venv deps ok" || { echo "[runner] venv missing deps"; exit 1; }
              [ -s "${TRANSCRIPT}" ] || { echo "[runner] transcript missing: ${TRANSCRIPT}"; exit 1; }
              WCFG="${WCFG_PATH}"
              [ -s "$WCFG" ] || { echo "[runner] missing $WCFG"; exit 1; }
              echo "[runner] exp21 sweep: arm=${ARM} rates=${RATE_LIST} rpm dur=${DURATION_MIN}min"
              echo "[runner] slo/tier keys: $(grep -A4 '"slo"' "$WCFG" | tr -d ' \n')"
              "$PYBIN" run_experiment.py \
                --engine llumnix --in-cluster \
                --workload mixed_request_level_poisson \
                --mode rate-sweep \
                --rate-list "${RATE_LIST}" \
                --duration-min "${DURATION_MIN}" \
                --load-procs "${LOAD_PROCS}" \
                --load-threads 2048 \
                --restart-per-condition \
                --disable-timeouts \
                --workload-config "${WCFG}" \
                --priority-mode deadline \
                --max-tokens "${MAX_TOKENS}" \
                --restart-timeout 1200 \
                --model "${MODEL_ID}" \
                --warmup-rpm 60 --warmup-sec 60 \
                --post-duration-grace 60 \
                --output-dir /work/results \
                --session-name "__SESSION__" \
                --metrics-interval 1.0
              rc=$?
              chown -R "${RESULT_UID}:${RESULT_GID}" /work/results 2>/dev/null || true
              echo "[runner] done rc=$rc"
              exit $rc
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: k3s, mountPath: /usr/local/bin/k3s, readOnly: true }
            - { name: hf-cache, mountPath: /hf-cache }
      volumes:
        - name: work
          hostPath:
            path: /home/nxclab/llumnix_reproduce/Agent_applications/agent_motivation_experiment
            type: Directory
        - name: k3s
          hostPath:
            path: /usr/local/bin/k3s
            type: File
        - name: hf-cache
          hostPath:
            path: /NHNHOME/huggingface
            type: Directory

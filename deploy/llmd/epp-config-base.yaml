# arm `llmd-base` — llm-d with no latency prediction.
#
# This is the upstream optimized-baseline plugin set (queue + KV + prefix +
# no-hit-LRU scorers) with file-discovery substituted for the InferencePool
# watch, exactly as guides/no-kubernetes-deployment/router/epp/config.yaml does.
#
# What it measures: llm-d routing on the signals every router in this class
# uses -- queue depth, KV occupancy, prefix cache overlap. No request budget is
# read and nothing is rejected. It is the reference the other two arms are read
# against, and it is also the closest thing in this experiment to a plain
# load-balancing router.
#
# The ConfigMap name is fixed (llmd-epp-config) and the arm is switched by
# applying a different file into the same name, so the Deployment does not
# change between arms.
#
# Metric names need no override: the EPP's built-in vLLM engine config already
# uses vllm:kv_cache_usage_perc, vllm:num_requests_waiting and
# vllm:num_requests_running, which is what our vLLM 0.12.1.dev0 exposes
# (pkg/epp/framework/plugins/datalayer/extractor/metrics/factories.go).
apiVersion: v1
kind: ConfigMap
metadata:
  name: llmd-epp-config
  namespace: llmd
  labels:
    app.kubernetes.io/part-of: llmd-baseline
    llmd.arm: base
data:
  config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig

    plugins:
      - name: file-discovery
        type: file-discovery
        parameters:
          path: /etc/epp/endpoints.yaml
          watchFile: true

      - type: queue-scorer
      - type: kv-cache-utilization-scorer
      - type: prefix-cache-scorer
      - type: no-hit-lru-scorer

      - name: metrics-source
        type: metrics-data-source
      - name: metrics-extractor
        type: core-metrics-extractor

    schedulingProfiles:
      - name: default
        plugins:
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: no-hit-lru-scorer
            weight: 2

    dataLayer:
      injectDefaults: false
      discovery:
        pluginRef: file-discovery
      sources:
        - pluginRef: metrics-source
          extractors:
            - pluginRef: metrics-extractor

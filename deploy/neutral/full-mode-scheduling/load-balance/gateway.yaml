apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
    role: gateway
spec:
  type: ClusterIP
  ports:
    - port: 8089
      targetPort: 8089
      protocol: TCP
      name: http
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    role: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        role: gateway
    spec:
      terminationGracePeriodSeconds: 300
      containers:
      - name: gateway
        image: ${REPOSITORY}/gateway:${GATEWAY_IMAGE_TAG}
        imagePullPolicy: Always
        command: ["/usr/local/bin/gateway"]
        args:
        - "--port"
        - "8089"
        - "-v"
        - "3"
        - "--discovery-redis-status-ttl-ms"
        - "60000"
        - "--scheduler-endpoints"
        - "scheduler:8088"
        - "--llm-backend-discovery"
        - "redis"
        - "--scheduler-discovery"
        - "endpoints"
        - "--discovery-redis-host"
        - "redis"
        - "--discovery-redis-port"
        - "6379"
        - "--scheduling-policy"
        - "load-balance"
        - "--tokenizer-path"
        - "/hf-cache/hub/models--meta-llama--Meta-Llama-3-8B-Instruct/snapshots/8afb486c1db24fe5011ec46dfbe5b5dccdb575c2"
        - "--max-model-len"
        - "8192"
        - "--enable-full-mode-scheduling=true"
        ports:
        - containerPort: 8089
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8089
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8089
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: hf-cache
          mountPath: /hf-cache
          readOnly: true
      volumes:
      - name: hf-cache
        hostPath:
          path: /NHNHOME/huggingface
          type: Directory

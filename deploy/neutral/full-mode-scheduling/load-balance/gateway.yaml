apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
    role: gateway
spec:
  type: ClusterIP
  ports:
    - port: 8089
      targetPort: 8089
      protocol: TCP
      name: http
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    role: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        role: gateway
    spec:
      terminationGracePeriodSeconds: 300
      containers:
      - name: gateway
        image: ${REPOSITORY}/gateway:${GATEWAY_IMAGE_TAG}
        imagePullPolicy: Always
        # Same arrangement as the scheduler: the host-built binary runs inside the
        # stock image through the /exp07bin hostPath.
        command: ["/exp07bin/gateway-exp10"]
        args:
        - "--port"
        - "8089"
        - "-v"
        - "3"
        - "--discovery-redis-status-ttl-ms"
        - "60000"
        - "--scheduler-endpoints"
        - "scheduler:8088"
        - "--llm-backend-discovery"
        - "redis"
        - "--scheduler-discovery"
        - "endpoints"
        - "--discovery-redis-host"
        - "redis"
        - "--discovery-redis-port"
        - "6379"
        - "--scheduling-policy"
        - "load-balance"
        - "--tokenizer-path"
        - "/hf-cache/hub/models--meta-llama--Meta-Llama-3.1-70B-Instruct/snapshots/1605565b47bb9346c5515c34102e054115b4f98b"
        - "--max-model-len"
        - "40960"
        - "--enable-full-mode-scheduling=true"
        env:
        - name: GATEWAY_SSE_READ_TIMEOUT
          value: "24h"
        - name: GATEWAY_RESPONSE_HEADER_TIMEOUT
          value: "24h"
        - name: GOMAXPROCS
          value: "16"
        ports:
        - containerPort: 8089
          name: http
          protocol: TCP
        resources:
          # NXC13 benchmarking: the default 500m (0.5 core) CPU limit CFS-throttled
          # the gateway and capped end-to-end throughput at ~37 resp/s while the GPU
          # engines sat idle (per-schedule latency ballooned 2ms->89ms). Raised to 8
          # cores so the control plane is not the bottleneck. See
          # Agent_applications/.../experiments/EXP-02.
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "64Gi"
            cpu: "8"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8089
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8089
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: exp07bin
          mountPath: /exp07bin
          readOnly: true
        - name: hf-cache
          mountPath: /hf-cache
          readOnly: true
      volumes:
      - name: exp07bin
        hostPath:
          path: /home/nxclab/llumnix_reproduce/bin
          type: Directory
      - name: hf-cache
        hostPath:
          path: /NHNHOME/huggingface
          type: Directory

apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: neutral
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 1
    workerTemplate:
      metadata:
        labels:
          llumnix.io/infer-type: "neutral"
          llumnix.io/model: "Meta-Llama-3-8B-Instruct"
      spec:
        terminationGracePeriodSeconds: 30
        containers:
        - name: vllm
          image: ${REPOSITORY}/vllm:${VLLM_IMAGE_TAG}
          securityContext:
            runAsGroup: 0
            runAsUser: 0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |-
              # Clear /dev/shm on start to prevent running out of space when crashes occur
              find /dev/shm -type f -delete

              #################
              # RUN vLLM (dense Llama-3-8B-Instruct): DP_SIZE_LOCAL independent instances, each
              # tensor-parallel across TP_SIZE local GPUs. Here 4 instances x TP=2 = 8 B200s.
              # No MoE/EP/DeepEP. TP uses NVLink between the 2 GPUs (not RDMA).
              #################
              # Instance i owns GPUs [TP_SIZE*i .. TP_SIZE*i+TP_SIZE-1] (i=0 -> 0,1; i=1 -> 2,3; ...).
              for i in $(seq 0 $((DP_SIZE_LOCAL - 1))); do
                PORT=$((8000 + i))
                GPU_START=$((TP_SIZE * i))
                GPUS=$(seq -s, "$GPU_START" $((GPU_START + TP_SIZE - 1)))

                CUDA_VISIBLE_DEVICES=$GPUS vllm serve \
                  meta-llama/Meta-Llama-3-8B-Instruct \
                  --port $PORT \
                  --tensor-parallel-size $TP_SIZE \
                  --max-model-len 8192 \
                  --gpu-memory-utilization 0.6 \
                  --async-scheduling \
                  &
              done

              # Wait for all background processes
              wait

          env:
          # configuration for Llumnix
          - name: LLUMNIX_CMS_REDIS_ADDRESS
            value: "redis"
          - name: LLUMNIX_CMS_REDIS_PORT
            value: "6379"
          - name: LLUMNIX_CMS_REDIS_USERNAME
            value: ""
          - name: LLUMNIX_CMS_REDIS_PASSWORD
            value: ""
          - name: VLLM_ENABLE_LLUMNIX
            value: "1"
          - name: LLUMNIX_ENABLE_MIGRATION
            value: "0"
          - name: LLUMNIX_INSTANCE_TYPE
            value: "neutral"

          # model source: pre-downloaded HuggingFace cache on Lustre, offline (no token, no download)
          - name: VLLM_USE_MODELSCOPE
            value: "false"
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: TRANSFORMERS_OFFLINE
            value: "1"
          - name: HF_HUB_CACHE
            value: /hf-cache/hub
          - name: DP_SIZE_LOCAL
            value: "4"
          - name: TP_SIZE
            value: "2"
          - name: TRITON_LIBCUDA_PATH
            value: /usr/lib64
          - name: VLLM_SKIP_P2P_CHECK
            value: "1"
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: VLLM_LOGGING_LEVEL
            value: INFO

          # Use cache directories from the mounted volume under one easy to mount
          # root directory.
          - name: CUDA_CACHE_PATH
            value: /var/cache/vllm/cuda
          - name: CCACHE_DIR
            value: /var/cache/vllm/ccache
          - name: VLLM_CACHE_ROOT
            value: /var/cache/vllm/vllm
          - name: FLASHINFER_WORKSPACE_BASE
            value: /var/cache/vllm/flashinfer

          ports:
          - containerPort: 8000
            name: metrics
            protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 2700
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
          - name: hf-cache
            mountPath: /hf-cache
            readOnly: true
          resources:
            limits:
              ephemeral-storage: 256Gi
              memory: 256Gi
              nvidia.com/gpu: "8"
            requests:
              cpu: 32
              ephemeral-storage: 256Gi
              memory: 256Gi
              nvidia.com/gpu: "8"
        - name: discovery
          image: ${REPOSITORY}/discovery:${DISCOVERY_IMAGE_TAG}
          command:
            - /bin/bash
            - -c
          args:
            - |-
              cd /discovery && \
              exec python3 -m discovery.discovery \
              --instance_type neutral \
              --pod_name $(POD_NAME) \
              --entrypoint_ip $(POD_IP) \
              --entrypoint_port 8000 \
              --kv_transfer_ip $(POD_IP) \
              --kv_transfer_port 28000 \
              --dp_size_local 4 \
              --redis_address redis \
              --redis_port 6379
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
        volumes:
        - name: hf-cache
          hostPath:
            path: /NHNHOME/huggingface
            type: Directory
  
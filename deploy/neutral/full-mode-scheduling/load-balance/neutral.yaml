apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: neutral
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 1
    workerTemplate:
      metadata:
        labels:
          llumnix.io/infer-type: "neutral"
          llumnix.io/model: "Meta-Llama-3-70B-Instruct"
      spec:
        terminationGracePeriodSeconds: 30
        containers:
        - name: vllm
          image: ${REPOSITORY}/vllm:${VLLM_IMAGE_TAG}
          securityContext:
            privileged: true
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RAWIO
              - SYS_RESOURCE
            runAsGroup: 0
            runAsUser: 0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |-
              # Clear /dev/shm on start to prevent running out of space when crashes occur
              find /dev/shm -type f -delete

              # unlimit memlock so Blade-KVT can register the KV cache as an RDMA memory region
              ulimit -SHl unlimited
              # File-based naming dir for inter-instance discovery (no Alibaba EAS needed); all
              # local instances share this container fs, so they find each other's KVT endpoints here.
              NAMING_DIR=/tmp/llumnix-kvt-naming
              mkdir -p "$NAMING_DIR"

              #################
              # RUN vLLM (dense Llama-3-8B-Instruct): DP_SIZE_LOCAL independent instances, each
              # tensor-parallel across TP_SIZE local GPUs. Here 4 instances x TP=2 = 8 B200s.
              # MIGRATION ON via Blade-KVT (HybridConnector). Mooncake does NOT support migration on
              # vLLM >0.12.0 (this image is 0.12.1), so KVT is the path.
              # ⚠️ backend MUST be "migration" (migration-only), NOT "kvt+migration": "kvt" is the
              # PD-disaggregation backend that treats EVERY request as needing a remote KV load
              # (ali_llumnix_disagg defaults true). In neutral mode the gateway never sets local-prefill,
              # so requests load wrong/absent KV -> garbage output (single engine aborts "no p"). The
              # migration-only backend processes requests locally and transfers KV only on real migration.
              # naming_url=file:$NAMING_DIR (file-system naming, no EAS). Each instance needs a unique
              # kvt_inst_id and a distinct rpc_port window (TP_SIZE ports each) to avoid collisions.
              # The KVT/ACCL transport ALSO opens a fixed TCP handshake listener whose base port is
              # BLLM_KVTRANS_PORT_BASE (default 31218, +1 per TP rank). Since all instances share this
              # pod's IP, give each a distinct BLLM_KVTRANS_PORT_BASE window or they EADDRINUSE-collide.
              #################
              # Instance i owns GPUs [TP_SIZE*i .. TP_SIZE*i+TP_SIZE-1] (i=0 -> 0,1; i=1 -> 2,3; ...).
              for i in $(seq 0 $((DP_SIZE_LOCAL - 1))); do
                PORT=$((8000 + i))
                GPU_START=$((TP_SIZE * i))
                GPUS=$(seq -s, "$GPU_START" $((GPU_START + TP_SIZE - 1)))
                RPC_PORT=$((28000 + i * TP_SIZE))
                KVT_PORT_BASE=$((31218 + i * 16))

                BLLM_KVTRANS_PORT_BASE=$KVT_PORT_BASE \
                CUDA_VISIBLE_DEVICES=$GPUS vllm serve \
                  meta-llama/Meta-Llama-3-70B-Instruct \
                  --port $PORT \
                  --tensor-parallel-size $TP_SIZE \
                  --disable-custom-all-reduce \
                  --max-model-len 8192 \
                  --gpu-memory-utilization 0.9 \
                  --async-scheduling \
                  --kv-transfer-config '{"kv_connector":"HybridConnector","kv_role":"kv_both","kv_connector_extra_config":{"backend":"migration","naming_url":"file:'"$NAMING_DIR"'","kvt_inst_id":"neutral-0-'"$i"'","rpc_port":'"$RPC_PORT"'}}' \
                  &
              done

              # Wait for all background processes
              wait

          env:
          # configuration for Llumnix
          - name: LLUMNIX_CMS_REDIS_ADDRESS
            value: "redis"
          - name: LLUMNIX_CMS_REDIS_PORT
            value: "6379"
          - name: LLUMNIX_CMS_REDIS_USERNAME
            value: ""
          - name: LLUMNIX_CMS_REDIS_PASSWORD
            value: ""
          - name: VLLM_ENABLE_LLUMNIX
            value: "1"
          - name: LLUMNIX_ENABLE_MIGRATION
            value: "1"
          - name: LLUMNIX_INSTANCE_TYPE
            value: "neutral"
          # KV transfer over RDMA/InfiniBand (NXC13 full node exposes /dev/infiniband).
          - name: VLLM_KV_TRANS_PROTOCOL
            value: rdma

          # model source: pre-downloaded HuggingFace cache on Lustre, offline (no token, no download)
          - name: VLLM_USE_MODELSCOPE
            value: "false"
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: TRANSFORMERS_OFFLINE
            value: "1"
          - name: HF_HUB_CACHE
            value: /hf-cache/hub
          - name: DP_SIZE_LOCAL
            value: "4"
          - name: TP_SIZE
            value: "2"
          - name: TRITON_LIBCUDA_PATH
            value: /usr/lib64
          - name: VLLM_SKIP_P2P_CHECK
            value: "1"
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: VLLM_LOGGING_LEVEL
            value: INFO

          # Use cache directories from the mounted volume under one easy to mount
          # root directory.
          - name: CUDA_CACHE_PATH
            value: /var/cache/vllm/cuda
          - name: CCACHE_DIR
            value: /var/cache/vllm/ccache
          - name: VLLM_CACHE_ROOT
            value: /var/cache/vllm/vllm
          - name: FLASHINFER_WORKSPACE_BASE
            value: /var/cache/vllm/flashinfer

          ports:
          - containerPort: 8000
            name: metrics
            protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 2700
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
          - name: hf-cache
            mountPath: /hf-cache
            readOnly: true
          - name: infiniband-devices
            mountPath: /dev/infiniband
          resources:
            limits:
              ephemeral-storage: 256Gi
              memory: 256Gi
              nvidia.com/gpu: "8"
            requests:
              cpu: 32
              ephemeral-storage: 256Gi
              memory: 256Gi
              nvidia.com/gpu: "8"
        - name: discovery
          image: ${REPOSITORY}/discovery:${DISCOVERY_IMAGE_TAG}
          command:
            - /bin/bash
            - -c
          args:
            - |-
              cd /discovery && \
              exec python3 -m discovery.discovery \
              --instance_type neutral \
              --pod_name $(POD_NAME) \
              --entrypoint_ip $(POD_IP) \
              --entrypoint_port 8000 \
              --kv_transfer_ip $(POD_IP) \
              --kv_transfer_port 28000 \
              --dp_size_local 4 \
              --redis_address redis \
              --redis_port 6379
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
        volumes:
        - name: hf-cache
          hostPath:
            path: /NHNHOME/huggingface
            type: Directory
        - name: infiniband-devices
          hostPath:
            path: /dev/infiniband
            type: Directory
  
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  labels:
    app: scheduler
    role: scheduler
spec:
  type: ClusterIP
  ports:
    - port: 8088
      targetPort: 8088
      protocol: TCP
      name: http
  selector:
    app: scheduler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  labels:
    app: scheduler
    role: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
        role: scheduler
    spec:
      terminationGracePeriodSeconds: 300
      containers:
        - name: scheduler
          image: ${REPOSITORY}/scheduler:${SCHEDULER_IMAGE_TAG}
          imagePullPolicy: Always
          # The policy under study is compiled into bin/scheduler-exp07 on the host and
          # run inside the stock image through the /exp07bin hostPath, so a policy change
          # needs a binary swap and a rollout, not an image build and push.
          command: ["/exp07bin/scheduler-exp07"]
          args:
            - "--port"
            - "8088"
            - "-v"
            - "4"
            - "--host"
            - "0.0.0.0"
            - "--llm-backend-discovery"
            - "redis"
            - "--discovery-redis-host"
            - "redis"
            - "--discovery-redis-port"
            - "6379"
            - "--scheduling-policy"
            - "load-balance"
            - "--cms-redis-host"
            - "redis"
            - "--cms-redis-port"
            - "6379"
            - "--cms-pull-status-interval-ms"
            - "500"
            - "--cms-pull-metadata-interval-ms"
            - "10000"
            - "--enable-full-mode-scheduling=true"
            # Run the rescheduling loop so the scheduler actually ISSUES migrate commands (engine-side
            # migration machinery is ready but idle without this). colocated-rescheduling-mode runs the
            # loop in-process (matches the working slo-aware reference). neutral_load rebalances neutral
            # instances by load; low thresholds make load-imbalance migration easy to observe.
            - "--colocated-rescheduling-mode=true"
            - "--rescheduling-policies"
            - "neutral_load,neutral_failover"
            - "--rescheduling-neutral-load-threshold"
            - "0.003"
            - "--rescheduling-load-balance-threshold"
            - "0.1"
            - "--rescheduling-interval-ms"
            - "500"
          ports:
            - containerPort: 8088
              name: http
              protocol: TCP
          resources:
            # NXC13 benchmarking: default 500m CPU limit CFS-throttled the scheduler;
            # under load each full-mode schedule decision ballooned 2ms->89ms (waiting
            # for CPU quota), serializing dispatch and capping throughput. Raised to 8
            # cores. See Agent_applications/.../experiments/EXP-02.
            requests:
              memory: "1Gi"
              cpu: "2"
            limits:
              memory: "4Gi"
              cpu: "8"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: exp07bin
              mountPath: /exp07bin
              readOnly: true
      volumes:
        - name: exp07bin
          hostPath:
            path: /home/nxclab/llumnix_reproduce/bin
            type: Directory
